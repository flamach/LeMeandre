backend:
  name: github
  repo: flamach/LeMeandre
  branch: main
  # Proxy OAuth indépendant de l'hébergeur (voir README section CMS) —
  # à remplacer par l'URL du Worker une fois déployé.
  base_url: https://decap-cms-github-oauth-api.lemeandre-admin.workers.dev
  auth_endpoint: auth

# Permet de tester le CMS en local avec `npx decap-server` avant d'avoir
# déployé le proxy OAuth (voir README).
local_backend: true

media_folder: "public_html/images"
public_folder: "/images"

collections:
  - name: "menu"
    label: "Menu du restaurant"
    files:
      - name: "menu"
        label: "Carte"
        file: "public_html/data/menu.json"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{fields.nom.fr}}"
            fields:
              - label: "Nom de la catégorie"
                name: "nom"
                widget: "object"
                fields:
                  - { label: "Français", name: "fr", widget: "string" }
                  - { label: "Anglais", name: "en", widget: "string" }
                  - { label: "Allemand", name: "de", widget: "string" }
                  - { label: "Espagnol", name: "es", widget: "string" }
                  - { label: "Néerlandais", name: "nl", widget: "string" }
              - label: "Plats"
                name: "plats"
                widget: "list"
                summary: "{{fields.nom.fr}} — {{fields.prix}}"
                fields:
                  - label: "Nom du plat"
                    name: "nom"
                    widget: "object"
                    fields:
                      - { label: "Français", name: "fr", widget: "string" }
                      - { label: "Anglais", name: "en", widget: "string" }
                      - { label: "Allemand", name: "de", widget: "string" }
                      - { label: "Espagnol", name: "es", widget: "string" }
                      - { label: "Néerlandais", name: "nl", widget: "string" }
                  - label: "Description"
                    name: "desc"
                    widget: "object"
                    fields:
                      - { label: "Français", name: "fr", widget: "string" }
                      - { label: "Anglais", name: "en", widget: "string" }
                      - { label: "Allemand", name: "de", widget: "string" }
                      - { label: "Espagnol", name: "es", widget: "string" }
                      - { label: "Néerlandais", name: "nl", widget: "string" }
                  - label: "Prix"
                    name: "prix"
                    widget: "string"
                    hint: "Ex : 24 €"
                  - label: "Photo du plat"
                    name: "photo"
                    widget: "image"
                    required: false
                    hint: "Pas encore affichée sur le site (voir README)."

  - name: "galerie"
    label: "Galerie photos"
    files:
      - name: "galerie"
        label: "Galerie du restaurant"
        file: "public_html/data/galerie.json"
        fields:
          - label: "Bandeau (haut de la page Restaurant)"
            name: "bandeau"
            widget: "image"
            required: false
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.legende.fr}}"
            fields:
              - label: "Photo"
                name: "photo"
                widget: "image"
              - label: "Légende"
                name: "legende"
                widget: "object"
                fields:
                  - { label: "Français", name: "fr", widget: "string" }
                  - { label: "Anglais", name: "en", widget: "string" }
                  - { label: "Allemand", name: "de", widget: "string" }
                  - { label: "Espagnol", name: "es", widget: "string" }
                  - { label: "Néerlandais", name: "nl", widget: "string" }

  - name: "agenda"
    label: "Agenda"
    files:
      - name: "agenda"
        label: "Événements à venir"
        file: "public_html/data/agenda.json"
        fields:
          - label: "Événements"
            name: "evenements"
            widget: "list"
            summary: "{{fields.date}} — {{fields.titre.fr}}"
            fields:
              - label: "Date"
                name: "date"
                widget: "date"
                date_format: "YYYY-MM-DD"
                hint: "L'événement disparaît automatiquement de la page une fois la date passée."
              - label: "Titre"
                name: "titre"
                widget: "object"
                fields:
                  - { label: "Français", name: "fr", widget: "string" }
                  - { label: "Anglais", name: "en", widget: "string" }
                  - { label: "Allemand", name: "de", widget: "string" }
                  - { label: "Espagnol", name: "es", widget: "string" }
                  - { label: "Néerlandais", name: "nl", widget: "string" }
              - label: "Description"
                name: "desc"
                widget: "object"
                fields:
                  - { label: "Français", name: "fr", widget: "string" }
                  - { label: "Anglais", name: "en", widget: "string" }
                  - { label: "Allemand", name: "de", widget: "string" }
                  - { label: "Espagnol", name: "es", widget: "string" }
                  - { label: "Néerlandais", name: "nl", widget: "string" }
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                hint: "Ex : affiche d'un concert. Facultatif — l'événement s'affiche sans photo si absente."

  - name: "gites-photos"
    label: "Photos des gîtes"
    files:
      - name: "gites"
        label: "Photos des 4 chambres"
        file: "public_html/data/gites.json"
        fields:
          - label: "Chambres (dans l'ordre : 1, 2, 3, 4)"
            name: "chambres"
            widget: "list"
            summary: "{{fields.srcA}}"
            fields:
              - { label: "Photo principale", name: "srcA", widget: "image" }
              - { label: "Photo détail 1", name: "srcB", widget: "image" }
              - { label: "Photo détail 2", name: "srcC", widget: "image" }
              - { label: "Photo détail 3", name: "srcD", widget: "image" }

  - name: "spa-photos"
    label: "Photos du spa"
    files:
      - name: "spa"
        label: "Photos du spa"
        file: "public_html/data/spa.json"
        fields:
          - label: "Bandeau (haut de la page Spa)"
            name: "bandeau"
            widget: "image"
            required: false
          - { label: "Photo principale", name: "srcA", widget: "image" }
          - { label: "Photo détail 1", name: "srcB", widget: "image" }
          - { label: "Photo détail 2", name: "srcC", widget: "image" }
          - { label: "Photo détail 3", name: "srcD", widget: "image" }

  - name: "photos-site"
    label: "Photos du site"
    files:
      - name: "images"
        label: "Photos uniques"
        file: "public_html/data/images.json"
        fields:
          - label: "Photo d'accueil (grand fond, page d'accueil)"
            name: "hero"
            widget: "image"
            required: false
          - label: "Vignette Restaurant (page d'accueil)"
            name: "accueilRestaurant"
            widget: "image"
            required: false
          - label: "Vignette Gîtes (page d'accueil)"
            name: "accueilGites"
            widget: "image"
            required: false
          - label: "Vignette Spa (page d'accueil)"
            name: "accueilSpa"
            widget: "image"
            required: false
          - label: "Affiche À emporter"
            name: "aEmporterAffiche"
            widget: "image"
            required: false
          - label: "Photo page Contact"
            name: "contact"
            widget: "image"
            required: false
